name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: v2.5.0
  PROMETHEUS_VERSION: 3.5.0

jobs:
  go:
    name: go · lint, test, validate, gen-check, promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web deps (make lint/test/gen-check reach into web/)
        run: cd web && npm ci --no-audit --no-fund
      - name: golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
      - run: make lint
      - run: make test
      - run: make validate
      - run: make gen-check
      - name: promtool ${{ env.PROMETHEUS_VERSION }}
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool --version
      - run: make promtool-check

  web:
    name: web · check + two-pass build (deploy/vercel-build.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - run: make web-check
      - name: build (same script Vercel runs)
        env:
          VERCEL_OUTPUT_FILE: bin/divy
          SITE_ORIGIN: https://example.vercel.app
        run: bash deploy/vercel-build.sh
      - name: smoke the embedded site
        run: |
          test -f internal/web/dist/index.html
          bin/divy version
          bin/divy serve --addr 127.0.0.1:18095 --db file:/tmp/ci.db --content ./content --log-level warn &
          for i in $(seq 1 30); do bin/divy ping --url http://127.0.0.1:18095/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -D - -o /dev/null http://127.0.0.1:18095/ | grep -i "x-divy-trace-id"
          curl -fsS -H 'Accept: text/plain' http://127.0.0.1:18095/ | head -3
          kill %1

  docker:
    name: docker · build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: divy:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts and answers /readyz
        run: |
          docker run -d --name divy -p 8080:8080 divy:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -D - http://127.0.0.1:8080/healthz
          docker logs divy
          docker rm -f divy
