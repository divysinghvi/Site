# content/uptime.yaml — probed by the collector every `interval` (brief §3.4); 90-day raw history.
# A `TODO(divy)` url is skipped by the collector and rendered as "unconfigured" (grey), never green.
# `$SITE_ORIGIN` in a url is expanded from the SITE_ORIGIN env var at load time (docs/drafts/vercel-adaptation.md).
targets:
  - id: savely-landing
    name: Savely landing page
    url: TODO(divy)
    span: project.savely
  - id: codemind-demo
    name: CodeMind demo
    url: TODO(divy)
    span: project.codemind
  - id: pypi-codemind
    name: codemind-ci on PyPI
    url: https://pypi.org/project/codemind-ci/
    span: project.codemind
  - id: github-profile
    name: GitHub profile
    url: https://github.com/divysinghvi
    method: HEAD
  - id: self-api
    name: This site's API (self)
    url: "$SITE_ORIGIN/readyz"
    timeout: 5s
    note: "probed from the same function that serves the site: a full outage shows as a gap, not red"
